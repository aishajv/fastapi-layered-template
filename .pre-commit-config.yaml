# Pre-commit hooks: ruff (format + lint) and mypy
# Install: poetry run pre-commit install
# Manual run: poetry run pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: poetry run mypy src/
        language: system
        types: [python]
        pass_filenames: false
