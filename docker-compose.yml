name: "{{ project_slug }}"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/{{ project_db_name }}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: "{{ project_db_name }}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d {{ project_db_name }}
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
